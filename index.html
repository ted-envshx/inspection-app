<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="巡檢紀錄">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>巡檢紀錄</title>
<style>
:root{
  --desk:#E3E6E9; --surface:#F7F8F9; --raised:#FFFFFF; --text:#22262B; --muted:#5E6570; --line:#C6CBD1;
  --accent:#1F3376; --on-accent:#FFFFFF; --accent-soft:#E5E9F4;
  --flag:#AE3A20; --flag-soft:#F7E5E0; --ok:#2E6A49; --ok-soft:#E2EFE7; --warn:#8A5A00; --warn-soft:#F6ECD4;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Songti TC","Noto Serif TC","PMingLiU",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#15181C; --surface:#21252B; --raised:#2A2F36; --text:#E6E8EB; --muted:#9BA2AB; --line:#3A4049;
  --accent:#A9BBF2; --on-accent:#111A35; --accent-soft:#283152;
  --flag:#F0907A; --flag-soft:#3B2520; --ok:#86C9A2; --ok-soft:#1E3328; --warn:#E8C26A; --warn-soft:#3A3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#15181C; --surface:#21252B; --raised:#2A2F36; --text:#E6E8EB; --muted:#9BA2AB; --line:#3A4049;
  --accent:#A9BBF2; --on-accent:#111A35; --accent-soft:#283152;
  --flag:#F0907A; --flag-soft:#3B2520; --ok:#86C9A2; --ok-soft:#1E3328; --warn:#E8C26A; --warn-soft:#3A3020; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button,input,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:12px 18px 130px}
.bar{display:flex;align-items:center;gap:10px;min-height:52px;flex-wrap:wrap}
.bar h1{font-family:var(--serif);font-size:1.45rem;margin:0;font-weight:700}
.spacer{flex:1}
.link{background:none;border:0;padding:10px 6px;color:var(--accent);font-weight:600;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:46px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{font-size:1.08rem;min-height:56px;padding:14px 22px}
.btn.small{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn.danger{color:var(--flag);border-color:var(--flag)}
.btn.danger.armed{background:var(--flag);color:var(--raised)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
input[type=text],input[type=date],textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-weight:600;margin:0 0 6px}
.note{color:var(--muted);font-size:.92rem}
h2.sec{font-family:var(--serif);font-size:1.15rem;margin:26px 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.84rem;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.issue{background:var(--flag-soft);color:var(--flag)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.idle{background:var(--accent-soft);color:var(--accent)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:16px 4px;text-align:left;cursor:pointer;color:inherit}
.row .t{font-weight:700;font-size:1.06rem;flex:1}
.row .m{color:var(--muted);font-size:.9rem;text-align:right}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:8px 0 14px;display:flex;gap:10px;align-items:flex-start}
.check{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--raised);cursor:pointer}
.check input{width:24px;height:24px;flex:none}
.check:has(input:checked){border-color:var(--accent)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--raised);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;min-height:46px}
.tab[aria-selected=true]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.92rem;display:flex;gap:6px;align-items:center;min-height:38px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--ok)}.dot.issue{background:var(--flag)}.dot.part{background:var(--warn)}
.tab[aria-selected=true] .dot{box-shadow:0 0 0 2px var(--on-accent)}
.sec-title{font-family:var(--serif);font-size:1.25rem;margin:22px 0 10px;font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.item{background:var(--raised);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.item.ok{border-color:var(--ok)}.item.issue{border-color:var(--flag)}
.item-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item-head b{font-size:1.04rem}
.item-head span{color:var(--muted);font-size:.88rem;text-align:right;flex:none}
.shot{aspect-ratio:4/3;border-radius:10px;background:var(--surface);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);cursor:pointer;width:100%}
.shot .cam{font-size:2rem;line-height:1}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.thumb.big{grid-column:1/-1;aspect-ratio:4/3}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700;cursor:pointer;min-height:48px}
.seg button[aria-pressed=true].ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed=true].issue{border-color:var(--flag);background:var(--flag-soft);color:var(--flag)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));z-index:15}
.dock-in{max-width:1060px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock .prog{flex:1;min-width:180px;font-size:.92rem;color:var(--muted)}
.dock .prog b{color:var(--text)}
.paper{background:#fff;color:#22262B;border-radius:6px;padding:26px 24px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 24px -14px rgba(0,0,0,.35)}
.paper h2{font-family:var(--serif);text-align:center;font-size:1.5rem;margin:0 0 16px;letter-spacing:.06em}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{border:1px solid #3A3F46;padding:10px 12px;text-align:left;vertical-align:top}
.paper th{background:#F1F2F3;font-weight:600;width:24%;white-space:nowrap}
.issue-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.issue-list li{display:flex;gap:12px;align-items:center}
.issue-list img{width:96px;height:72px;object-fit:cover;border-radius:6px;flex:none;border:1px solid #D0D4D9}
.issue-list .np{width:96px;height:72px;border-radius:6px;border:1px dashed #A3A9B1;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#6A7079;flex:none}
.issue-list .txt{color:#AE3A20;font-weight:600}
.pad-wrap{background:#fff;border-radius:10px;border:1.5px solid #C6CBD1;position:relative;overflow:hidden;margin-top:6px}
.pad-wrap canvas{display:block;width:100%;height:240px;touch-action:none}
.pad-wrap .baseline{position:absolute;left:28px;right:28px;bottom:56px;border-bottom:1.5px dashed #A3A9B1;pointer-events:none}
.pad-wrap .hint{position:absolute;left:28px;bottom:20px;color:#8C929A;font-size:.92rem;pointer-events:none}
.paper input[type=text]{background:#fff;color:#22262B;border-color:#C6CBD1}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--surface);border-radius:16px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto}
.dialog h3{margin:0 0 8px;font-family:var(--serif);font-size:1.2rem}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
.lightbox img{max-height:80%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--desk);padding:12px 18px;border-radius:10px;z-index:50;font-weight:600;max-width:90%}
.busy{position:fixed;inset:0;background:rgba(10,12,16,.6);z-index:45;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.1rem;text-align:center;padding:20px}
.item.active{outline:3px solid var(--accent);outline-offset:2px}
.item{cursor:pointer}
.shot.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tray-wrap{overflow-x:auto;margin:-2px -18px 8px;padding:2px 18px 4px;scrollbar-width:none}
.tray-wrap::-webkit-scrollbar{display:none}
.tray{display:flex;gap:8px;width:max-content;max-width:none}
.tray-add{flex:none;width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;line-height:1.3}
.tp{position:relative;flex:none;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--raised)}
.tp img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.tp.used img{opacity:.38}
.tp .ck{position:absolute;left:5px;top:3px;color:var(--ok);font-weight:800;font-size:1.1rem;text-shadow:0 0 3px #fff}
.tp .zoom{position:absolute;right:3px;bottom:3px;width:28px;height:28px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:.9rem}
.lightbox{flex-direction:column;gap:14px}
.lb-tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wrap{padding-bottom:230px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" accept="image/*" multiple class="hidden-input" id="libInput" aria-hidden="true" tabindex="-1">
<input type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden-input" id="cfgInput" aria-hidden="true" tabindex="-1">
<script src="jspdf.umd.min.js"></script>
<script src="xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
/* ================= 基本工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const p2=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const slash=iso=>iso?iso.replace(/-/g,'/'):'';
const dots=iso=>iso?iso.split('-').map(Number).join('.'):'';
const clone=o=>JSON.parse(JSON.stringify(o));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function busy(m){let b=$('#busy');if(!m){b&&b.remove();return}if(!b){b=document.createElement('div');b.id='busy';b.className='busy';document.body.appendChild(b)}b.textContent=m}
function armed(btn,label,fn){if(!btn)return;btn.onclick=async()=>{if(!btn.classList.contains('armed')){btn.classList.add('armed');btn.dataset.orig=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected&&btn.classList.contains('armed')){btn.classList.remove('armed');btn.textContent=btn.dataset.orig}},4000);return}btn.disabled=true;await fn()}}
function ask(msg,okLabel,cancelLabel){return new Promise(res=>{const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true"><p style="margin-top:0">${msg}</p><div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" data-a="0">${esc(cancelLabel||'取消')}</button><button class="btn primary" data-a="1">${esc(okLabel||'確定')}</button></div></div>`;document.body.appendChild(ov);$$('[data-a]',ov).forEach(b=>b.onclick=()=>{ov.remove();res(b.dataset.a==='1')});$('[data-a="1"]',ov).focus()})}

/* ================= 類別 ================= */
const CATS={
  '空':{name:'空污',title:'固定污染源定期巡檢紀錄',issue:'現場需要修改事項',grouped:true},
  '水':{name:'水污',title:'廢水處理設施定期巡檢紀錄表',issue:'現場需注意事項',grouped:false},
  '廢':{name:'廢棄物',title:'廢棄物定期巡檢紀錄',issue:'現場需要修改事項',grouped:false}
};
const CAT_ORDER=['空','水','廢'];
function normCat(v){v=String(v||'').trim();if(!v)return'';if(/^空/.test(v))return'空';if(/^水|廢水/.test(v))return'水';if(/^廢/.test(v))return'廢';return null}

/* ================= IndexedDB ================= */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('inspect-pwa-v2',1);r.onupgradeneeded=()=>{const d=r.result;['visits','photos','meta'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  run(s,mode,fn){return new Promise((res,rej)=>{const t=DB.db.transaction(s,mode);const q=fn(t.objectStore(s));let out;if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all:s=>DB.run(s,'readonly',st=>st.getAll()),get:(s,id)=>DB.run(s,'readonly',st=>st.get(id)),
  put:(s,v)=>DB.run(s,'readwrite',st=>st.put(v)),del:(s,id)=>DB.run(s,'readwrite',st=>st.delete(id))};

/* ================= 狀態 ================= */
let config=null,visits=[],settings={id:'settings',inspector:'',stamp:false,hideInstall:false};
const ui={cat:{}};
const urlCache=new Map();
async function photoURL(id){if(!id)return null;if(urlCache.has(id))return urlCache.get(id);const p=await DB.get('photos',id);if(!p)return null;const u=URL.createObjectURL(p.blob);urlCache.set(id,u);return u}
async function hydrate(root=app){for(const img of $$('img[data-photo]',root)){if(img.src)continue;const u=await photoURL(img.dataset.photo);if(u)img.src=u}}
const saveVisit=v=>DB.put('visits',v);
const saveVisitSoon=debounce(v=>saveVisit(v),400);
const saveSettings=()=>DB.put('meta',settings);
const visitById=id=>visits.find(v=>v.id===id);
const clientByKey=k=>config&&config.clients.find(c=>c.key===k);

/* ================= 設定檔解析 ================= */
function parseWorkbook(wb,fileName){
  const clients=[],warnings=[];
  for(const sn of wb.SheetNames){
    if(sn.trim()==='說明')continue;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false}).map(r=>r.map(c=>String(c??'').trim()));
    let name='';const contacts={};const cats={};
    const nameRow=rows.find(r=>r[0]==='客戶名稱');if(nameRow)name=nameRow[1];
    if(!name){name=sn;warnings.push(`「${sn}」沒有填客戶名稱，先用分頁名稱代替`)}
    const ci=rows.findIndex(r=>r[0]==='類別'&&r[1]==='負責人');
    if(ci>=0){for(let i=ci+1;i<rows.length;i++){const r=rows[i];if(!r[0]&&!r[1])break;const c=normCat(r[0]);if(!c){warnings.push(`「${sn}」第 ${i+1} 列的類別「${r[0]}」看不懂，請填 空、水、廢`);continue}contacts[c]=r[1]||''}}
    const hi=rows.findIndex(r=>r[0]==='類別'&&r[1]==='編號');
    if(hi<0){warnings.push(`「${sn}」找不到檢查項目表的標題列（類別、編號、名稱、檢查項目、正常範圍），這個分頁已略過`);continue}
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i];if(!r.slice(0,5).some(Boolean))continue;
      const c=normCat(r[0]);if(!c){warnings.push(`「${sn}」第 ${i+1} 列的類別「${r[0]}」看不懂，這列已略過`);continue}
      const [code,gname,item,range]=[r[1],r[2],r[3],r[4]];
      const list=cats[c]||(cats[c]=[]);const last=list[list.length-1];
      const g=(last&&last.code===code&&last.name===gname)?last:(list.push({code,name:gname,items:[]}),list[list.length-1]);
      g.items.push({item,range});
      if(!(c in contacts))contacts[c]='';
    }
    if(!Object.keys(cats).length){warnings.push(`「${sn}」沒有任何檢查項目，已略過`);continue}
    clients.push({key:sn.trim(),name,contacts,cats});
  }
  return{fileName,importedAt:Date.now(),clients,warnings};
}
async function importConfig(file){
  busy('讀取設定檔中…');
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const cfg=parseWorkbook(wb,file.name);busy();
    if(!cfg.clients.length){await ask(`這個檔案裡找不到可用的客戶分頁。${cfg.warnings.length?'<br><br>'+cfg.warnings.map(esc).join('<br>'):''}`,'知道了','關閉');return}
    config=Object.assign({id:'config'},cfg);await DB.put('meta',config);
    await ask(`已匯入 ${cfg.clients.length} 家客戶：${cfg.clients.map(c=>esc(c.key)).join('、')}${cfg.warnings.length?'<br><br><b>需要留意：</b><br>'+cfg.warnings.map(esc).join('<br>'):''}`,'好','關閉');
    route();
  }catch(e){busy();toast('這個檔案讀不到，請確認是 Excel 設定檔')}
}
$('#cfgInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importConfig(f)});

/* ================= 巡檢資料工具 ================= */
const iid=(cat,gi,ii)=>`${cat}-${gi}-${ii}`;
function eachItem(v,cat,fn){(v.snap[cat]||[]).forEach((g,gi)=>g.items.forEach((it,ii)=>fn(g,it,iid(cat,gi,ii),gi,ii)))}
function itemTitle(cat,g,it){if(CATS[cat].grouped)return it.item||g.name||g.code;return[g.code,g.name,it.item].filter(Boolean).join(' ')}
function pdfLabel(cat,g,it){
  const rg=it.range?`(${it.range})`:'';
  if(CATS[cat].grouped){if(it.item==='標示'||it.item==='外觀')return it.item;return`${g.code} ${it.item||g.name}${rg}`}
  return[g.code,g.name,it.item].filter(Boolean).join(' ')+rg;
}
function defaultNote(cat,g,it){
  const base=CATS[cat].grouped?`${g.code} ${it.item||g.name}`:[g.code,g.name,it.item].filter(Boolean).join(' ');
  return it.range?`${base}超過範圍`:`${base} `;
}
function catStats(v,cat){
  let total=0,checked=0,withPhoto=0,issues=0;
  eachItem(v,cat,(g,it,id)=>{total++;const r=v.results[id];if(r){if(r.state)checked++;if(r.photos&&r.photos.length)withPhoto++;if(r.state==='issue')issues++}});
  const ex=v.extra[cat]||[];issues+=ex.length;
  const missing=(total-withPhoto)+ex.filter(x=>!x.photos.length).length;
  return{total,checked,withPhoto,issues,missing};
}
function issueList(v,cat){
  const out=[];
  eachItem(v,cat,(g,it,id)=>{const r=v.results[id];if(r&&r.state==='issue')out.push({note:(r.note||defaultNote(cat,g,it)).trim(),photos:r.photos||[]})});
  for(const x of v.extra[cat]||[])out.push({note:(x.note||'其他缺失').trim(),photos:x.photos});
  return out;
}
const remarkOf=(v,cat)=>{const l=issueList(v,cat);return l.length?l.map(x=>x.note).join('、'):'OK'};
const gkeyOf=(v,cat)=>(v.contacts[cat]||'').trim()||'__none';
function signGroups(v){const map=new Map();for(const c of v.cats){const k=gkeyOf(v,c);if(!map.has(k))map.set(k,{key:k,contact:k==='__none'?'':k,cats:[]});map.get(k).cats.push(c)}return[...map.values()]}
const sigOf=(v,cat)=>v.sigs[gkeyOf(v,cat)]||null;
function groupState(v,gi){
  let set=0,iss=0,ph=0,n=0;const cat=ui.cat[v.id];const g=v.snap[cat][gi];
  g.items.forEach((it,ii)=>{n++;const r=v.results[iid(cat,gi,ii)];if(r){if(r.state)set++;if(r.state==='issue')iss++;if(r.photos&&r.photos.length)ph++}});
  if(iss)return'issue';if(set===n&&ph===n)return'done';if(set||ph)return'part';return'';
}
function visitStatus(v){
  const groups=signGroups(v);const signed=groups.filter(g=>v.sigs[g.key]).length;
  const missing=v.cats.reduce((a,c)=>a+catStats(v,c).missing,0);
  if(signed<groups.length)return{label:signed?`已簽 ${signed}/${groups.length}`:'未簽名',cls:'idle'};
  if(missing)return{label:`已簽名，缺 ${missing} 張照片`,cls:'warn'};
  return{label:'可輸出 PDF',cls:'ok'};
}
function photoUseCount(v,id,skipTray){let n=0;if(!skipTray&&v.tray)for(const t of v.tray)if(t.id===id)n++;for(const k in v.results)for(const p of v.results[k].photos||[])if(p===id)n++;for(const c in v.extra)for(const x of v.extra[c])for(const p of x.photos)if(p===id)n++;return n}
async function dropPhoto(id){const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}await DB.del('photos',id)}
async function deleteVisit(v){
  const ids=new Set();for(const k in v.results)for(const p of v.results[k].photos||[])ids.add(p);for(const c in v.extra)for(const x of v.extra[c])x.photos.forEach(p=>ids.add(p));(v.tray||[]).forEach(t=>ids.add(t.id));
  for(const id of ids)await dropPhoto(id);
  visits=visits.filter(x=>x!==v);await DB.del('visits',v.id);
}
// 已簽名的類別若要改內容，先確認並清除簽名
async function guardEdit(v,cat){
  if(!sigOf(v,cat))return true;
  const ok=await ask(`「${CATS[cat].name}」已經請客戶簽名了。<br>修改正常／異常或缺失內容後，需要請客戶重新簽名。<br><span class="note">補拍照片不需要重新簽名。</span>`,'修改並清除簽名','不要修改');
  if(ok){delete v.sigs[gkeyOf(v,cat)];await saveVisit(v);toast('已清除簽名，修改完請客戶重新簽名')}
  return ok;
}

/* ================= 照片 ================= */
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
// 讀 JPEG 的 EXIF 拍攝時間，讀不到就回傳 null
async function exifTime(file){
  try{
    const d=new DataView(await file.slice(0,256*1024).arrayBuffer());
    if(d.getUint16(0)!==0xFFD8)return null;
    let off=2;
    while(off<d.byteLength-4){
      const marker=d.getUint16(off),len=d.getUint16(off+2);
      if(marker===0xFFE1&&d.getUint32(off+4)===0x45786966){
        const t=off+10,le=d.getUint16(t)===0x4949,u16=o=>d.getUint16(o,le),u32=o=>d.getUint32(o,le);
        const ifd=o=>{const n=u16(o),out={};for(let i=0;i<n;i++){const e=o+2+i*12;out[u16(e)]={count:u32(e+4),val:e+8}}return out};
        const str=en=>{const o=en.count>4?t+u32(en.val):en.val;let s='';for(let i=0;i<en.count-1;i++)s+=String.fromCharCode(d.getUint8(o+i));return s};
        const i0=ifd(t+u32(t+4));let dt=null;
        if(i0[0x8769]){const ex=ifd(t+u32(i0[0x8769].val));if(ex[0x9003])dt=str(ex[0x9003])}
        if(!dt&&i0[0x0132])dt=str(i0[0x0132]);
        const m=dt&&dt.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
        return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime():null;
      }
      if((marker&0xFF00)!==0xFF00)break;off+=2+len;
    }
  }catch(e){}
  return null;
}
async function processPhoto(file){
  const taken=(await exifTime(file))||file.lastModified||Date.now();
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImage(url);
    const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
    if(settings.stamp){const when=new Date(taken);const txt=`${when.getFullYear()}/${when.getMonth()+1}/${when.getDate()}`;const fs=Math.round(Math.max(c.width,c.height)*.032);
      g.font=`600 ${fs}px -apple-system,"Helvetica Neue",Arial,sans-serif`;g.textAlign='right';g.textBaseline='bottom';
      g.lineWidth=Math.max(2,fs/8);g.strokeStyle='rgba(0,0,0,.45)';g.strokeText(txt,c.width-fs*.6,c.height-fs*.5);g.fillStyle='#E8792B';g.fillText(txt,c.width-fs*.6,c.height-fs*.5)}
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));c.width=c.height=0;
    if(!blob)throw new Error('encode');
    const id=uid();await DB.put('photos',{id,blob,takenAt:taken});return{id,t:taken};
  }finally{URL.revokeObjectURL(url)}
}
// 從相簿選照片：處理後加入照片匣，target(ids) 可再把它們放進某一格
let photoTarget=null;
function pickPhotos(target){photoTarget=target;const i=$('#libInput');i.value='';i.click()}
$('#libInput').addEventListener('change',async e=>{
  const files=[...(e.target.files||[])];if(!files.length||!photoTarget)return;const t=photoTarget;photoTarget=null;
  const out=[];let fail=0;
  try{for(let i=0;i<files.length;i++){busy(`處理照片 ${i+1}／${files.length}…`);try{out.push(await processPhoto(files[i]))}catch(err){fail++}}
    if(out.length)await t(out);if(fail)toast(`有 ${fail} 張照片讀取失敗`)}finally{busy()}
});
function lightbox(id,actions){photoURL(id).then(u=>{if(!u)return;const lb=document.createElement('div');lb.className='lightbox';
  lb.innerHTML=`<img src="${u}" alt="照片放大">${actions&&actions.length?`<div class="lb-tools">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>`:''}`;
  lb.onclick=e=>{const b=e.target.closest('[data-i]');lb.remove();if(b)actions[+b.dataset.i].fn()};document.body.appendChild(lb)})}

/* ================= 路由 ================= */
const go=h=>{location.hash=h};
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);route()});
function route(){
  const [p,a,b]=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);
  if(p==='new'&&config){if(a&&clientByKey(a))return pageNewCats(clientByKey(a));return pageNewClient()}
  if(p==='v'&&visitById(a))return pageVisit(visitById(a));
  if(p==='s'&&visitById(a))return b!==undefined?pageSign(visitById(a),+b):pageSignList(visitById(a));
  if(p==='settings')return pageSettings();
  return pageHome();
}

/* ================= 巡檢畫面 ================= */

  if(!ui.cat[v.id]||!v.cats.includes(ui.cat[v.id]))ui.cat[v.id]=v.cats[0];
  const cat=ui.cat[v.id];const C=CATS[cat];const groups=v.snap[cat];
  const order=[];eachItem(v,cat,(g,it,id)=>order.push(id));(v.extra[cat]||[]).forEach(x=>order.push('x:'+x.id));
  const active=ui.active&&ui.active[v.id];
  const card=(g,it,id)=>{
    const r=v.results[id]||{};const ph=r.photos||[];
    const idx=order.indexOf(id);const prevId=idx>0?order[idx-1]:null;const prevPh=prevId&&v.results[prevId]&&v.results[prevId].photos||[];
    const on=active===id;
    return`<div class="item ${r.state||''} ${on?'active':''}" data-id="${id}">
      <div class="item-head"><b>${esc(itemTitle(cat,g,it))}</b><span>${esc(it.range)}</span></div>
      ${ph.length?`<div class="thumbs">${ph.map((p,i)=>`<div class="thumb ${ph.length===1?'big':''}"><img data-photo="${p}" data-a="view" data-p="${p}" alt="照片 ${i+1}"><button class="x" data-a="rm" data-p="${p}" aria-label="移除照片 ${i+1}">×</button></div>`).join('')}</div>`
        :`<div class="shot ${on?'on':''}" data-a="sel">${on?'<b>請點下方照片匣裡的照片</b>':'<span class="cam">🖼️</span><span>點這格，再點下方照片</span>'}</div>`}

        ${ph.length?`<button class="btn small" data-a="sel">${on?'選取中…':'再放一張'}</button>`:''}
        <button class="btn small" data-a="lib">從相簿選</button>

      </div>
      <div class="seg" role="group" aria-label="狀態"><button class="ok" data-a="ok" aria-pressed="${r.state==='ok'}">正常</button><button class="issue" data-a="issue" aria-pressed="${r.state==='issue'}">異常</button></div>
      ${r.state==='issue'?`<textarea data-a="note" aria-label="${esc(C.issue)}">${esc(r.note||'')}</textarea>`:''}
    </div>`;
  };
  const extraCard=(x,xi)=>{const key='x:'+x.id;const on=active===key;return`<div class="item issue ${on?'active':''}" data-x="${xi}">
      <textarea data-a="xnote" aria-label="缺失內容" placeholder="例如：廢液空桶未貼有害標示">${esc(x.note)}</textarea>
      ${x.photos.length?`<div class="thumbs">${x.photos.map((p,i)=>`<div class="thumb ${x.photos.length===1?'big':''}"><img data-photo="${p}" data-a="view" data-p="${p}" alt="照片 ${i+1}"><button class="x" data-a="xrm" data-p="${p}" aria-label="移除照片">×</button></div>`).join('')}</div>`
        :`<div class="shot ${on?'on':''}" data-a="xsel">${on?'<b>請點下方照片匣裡的照片</b>':'<span class="cam">🖼️</span><span>點這格，再點下方照片</span>'}</div>`}
      <div class="tools">${x.photos.length?`<button class="btn small" data-a="xsel">${on?'選取中…':'再放一張'}</button>`:''}<button class="btn small" data-a="xlib">從相簿選</button><button class="btn small danger" data-a="xdel">刪除這項</button></div>
    </div>`};

function makePad(canvas,onChange){
  const ctx=canvas.getContext('2d');let has=false,drawing=false,last=null;
  function size(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;let snap=null;
    if(has){snap=document.createElement('canvas');snap.width=canvas.width;snap.height=canvas.height;snap.getContext('2d').drawImage(canvas,0,0)}
    canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1F3376';ctx.fillStyle='#1F3376';
    if(snap){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(snap,0,0,canvas.width,canvas.height);ctx.restore()}}
  const pt=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pointerType==='pen'&&e.pressure?e.pressure:.5}};
  const w=p=>1.6+p*2.6;
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,w(last.p)/2,0,Math.PI*2);ctx.fill();if(!has){has=true;onChange(true)}});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){const p=pt(ev);ctx.lineWidth=w(p.p);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.quadraticCurveTo(last.x,last.y,(last.x+p.x)/2,(last.y+p.y)/2);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}});
  const end=()=>{drawing=false;last=null};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
  let t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>{if(canvas.isConnected)size()},150)});
  size();
  return{clear(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();has=false;onChange(false)},
    toDataURL(){const W=720,H=Math.round(W*canvas.height/canvas.width);const o=document.createElement('canvas');o.width=W;o.height=H;o.getContext('2d').drawImage(canvas,0,0,W,H);return o.toDataURL('image/png')}};
}

/* ================= PDF ================= */
const PW=1240,PH=1754,PM=110,TW=PW-2*PM;
const FS='"Songti TC","STSong","Noto Serif TC","PMingLiU",serif';
function newPage(){const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,PW,PH);g.textBaseline='middle';return{cv,g}}
function cell(g,x,y,w,h,fill){if(fill){g.fillStyle=fill;g.fillRect(x,y,w,h)}g.strokeStyle='#222';g.lineWidth=1.6;g.strokeRect(x,y,w,h)}
function ctext(g,t,x,y,w,size,weight,color){g.fillStyle=color||'#111';let s=size;g.font=`${weight||400} ${s}px ${FS}`;g.textAlign='center';while(g.measureText(t).width>w-24&&s>14){s--;g.font=`${weight||400} ${s}px ${FS}`}g.fillText(t,x+w/2,y)}
function wrapText(g,t,x,y,w,h,size,color){g.font=`${size}px ${FS}`;g.fillStyle=color||'#111';g.textAlign='left';const lines=[];let cur='';for(const ch of t){if(g.measureText(cur+ch).width>w&&cur){lines.push(cur);cur=ch}else cur+=ch}if(cur)lines.push(cur);const lh=size*1.35;const n=Math.min(lines.length,Math.max(1,Math.floor(h/lh)));const sy=y+h/2-(n-1)*lh/2;for(let i=0;i<n;i++)g.fillText(lines[i],x,sy+i*lh)}
async function drawPhoto(g,id,x,y,w,h){
  let bmp=null;
  if(id){const p=await DB.get('photos',id);if(p){try{bmp=await createImageBitmap(p.blob)}catch(e){try{const u=URL.createObjectURL(p.blob);bmp=await loadImage(u);URL.revokeObjectURL(u)}catch(e2){}}}}
  if(!bmp){g.fillStyle='#8A9099';g.font=`26px ${FS}`;g.textAlign='center';g.fillText('（照片待補）',x+w/2,y+h/2);return}
  const pad=8,s=Math.min((w-2*pad)/bmp.width,(h-2*pad)/bmp.height),iw=bmp.width*s,ih=bmp.height*s;
  g.drawImage(bmp,x+(w-iw)/2,y+(h-ih)/2,iw,ih);if(bmp.close)bmp.close();
}
async function drawPhotoRow(g,ids,x,y,w,h){if(!ids.length)return drawPhoto(g,null,x,y,w,h);const n=ids.length,cw=w/n;for(let i=0;i<n;i++)await drawPhoto(g,ids[i],x+i*cw,y,cw,h)}
// 把項目排成列：單張照片的項目兩兩一列；多張照片的項目自己佔一整列（每列最多 3 張）
function layoutRows(entries){
  const rows=[];let pend=null;
  for(const e of entries){
    if(e.photos.length<=1){if(pend){rows.push({type:'pair',a:pend,b:e});pend=null}else pend=e}
    else{if(pend){rows.push({type:'pair',a:pend,b:null});pend=null}for(let i=0;i<e.photos.length;i+=3)rows.push({type:'full',e,photos:e.photos.slice(i,i+3),first:i===0})}
  }
  if(pend)rows.push({type:'pair',a:pend,b:null});
  return rows;
}
async function buildPdf(v,cat){
  const C=CATS[cat];const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4',compress:true});let first=true;
  const add=cv=>{if(!first)doc.addPage();first=false;doc.addImage(cv.toDataURL('image/jpeg',.85),'JPEG',0,0,595.28,841.89,undefined,'FAST');cv.width=cv.height=0};
  // 封面
  let {cv,g}=newPage();
  ctext(g,C.title,0,175,PW,56,700);
  let y=225;
  cell(g,PM,y,TW,76,'#EFEFEF');ctext(g,`事業名稱: ${v.clientName}`,PM,y+38,TW,30);y+=76;
  cell(g,PM,y,TW/2,88);cell(g,PM+TW/2,y,TW/2,88);ctext(g,`巡檢日期:${slash(v.date)}`,PM,y+44,TW/2,28);ctext(g,`巡檢人員:${v.inspector}`,PM+TW/2,y+44,TW/2,28);
  y+=88+38;
  const issues=issueList(v,cat);
  if(!issues.length){cell(g,PM,y,TW,78,'#EFEFEF');ctext(g,`${C.issue}：無`,PM,y+39,TW,30)}
  for(const it of issues){
    const ph=it.photos.length?(it.photos.length===1?440:380):110;const need=78+ph;
    if(y+need>PH-90){add(cv);({cv,g}=newPage());y=110}
    cell(g,PM,y,TW,78,'#EFEFEF');ctext(g,`${C.issue}：${it.note}`,PM,y+39,TW,30);
    cell(g,PM,y+78,TW,ph);await drawPhotoRow(g,it.photos.slice(0,3),PM,y+78,TW,ph);
    y+=need+38;
  }
  add(cv);
  // 項目頁
  const labelH=44;
  async function drawRows(rows,headText,fixedPhotoH){
    ({cv,g}=newPage());y=100;
    const head=t=>{cell(g,PM,y,TW,78,'#EFEFEF');ctext(g,t,PM,y+39,TW,32);y+=78};
    if(headText)head(headText);
    const photoH=fixedPhotoH||Math.max(300,Math.min(420,Math.floor((PH-80-y)/Math.max(1,rows.length))-labelH));
    for(const r of rows){
      const rh=(r.type==='full'&&!r.first?0:labelH)+photoH;
      if(y+rh>PH-60){add(cv);({cv,g}=newPage());y=100;if(headText)head(headText+'（續）')}
      if(r.type==='pair'){
        for(const [k,e] of [[0,r.a],[1,r.b]]){const x=PM+k*TW/2;
          if(!e){cell(g,x,y,TW/2,labelH+photoH);continue}
          cell(g,x,y,TW/2,labelH,e.basic?null:'#F6F6F6');ctext(g,e.label,x,y+labelH/2,TW/2,25);
          cell(g,x,y+labelH,TW/2,photoH);await drawPhoto(g,e.photos[0]||null,x,y+labelH,TW/2,photoH)}
        y+=labelH+photoH;
      }else{
        if(r.first){cell(g,PM,y,TW,labelH,'#F6F6F6');ctext(g,r.e.label,PM,y+labelH/2,TW,25);y+=labelH}
        cell(g,PM,y,TW,photoH);await drawPhotoRow(g,r.photos,PM,y,TW,photoH);y+=photoH;
      }
    }
    add(cv);
  }
  const entriesOf=(gr,gi)=>gr.items.map((it,ii)=>{const r=v.results[iid(cat,gi,ii)]||{};return{label:pdfLabel(cat,gr,it),basic:C.grouped&&(it.item==='標示'||it.item==='外觀'),photos:r.photos||[]}});
  if(C.grouped){for(const [gi,gr] of v.snap[cat].entries())await drawRows(layoutRows(entriesOf(gr,gi)),`${gr.code} ${gr.name}`)}
  else{const all=[];v.snap[cat].forEach((gr,gi)=>all.push(...entriesOf(gr,gi)));if(all.length)await drawRows(layoutRows(all),null,400)}
  // 簽名表
  ({cv,g}=newPage());
  g.fillStyle='#333';g.font=`22px ${FS}`;g.textAlign='left';g.fillText(C.name,PM,110);
  y=140;cell(g,PM,y,TW,110,'#EFEFEF');ctext(g,`${v.clientName}－巡檢紀錄簽名表`,PM,y+55,TW,38,700);y+=110;
  const cw=[.19,.18,.23,.40].map(f=>f*TW),xs=[PM];cw.forEach(w=>xs.push(xs[xs.length-1]+w));
  ['巡檢日期','巡檢人員','客戶簽名處','備註'].forEach((t,i)=>{cell(g,xs[i],y,cw[i],76,'#EFEFEF');ctext(g,t,xs[i],y+38,cw[i],28)});y+=76;
  const rowH=Math.floor((PH-100-y)/12);const sig=sigOf(v,cat);
  for(let i=0;i<12;i++){
    for(let k=0;k<4;k++)cell(g,xs[k],y,cw[k],rowH);
    if(i===0){
      ctext(g,dots(v.date),xs[0],y+rowH/2,cw[0],26);ctext(g,v.inspector,xs[1],y+rowH/2,cw[1],26);
      if(sig){const im=await loadImage(sig.img).catch(()=>null);if(im){const bw=cw[2]-14,bh=rowH-10,sc=Math.min(bw/im.width,bh/im.height);g.drawImage(im,xs[2]+(cw[2]-im.width*sc)/2,y+(rowH-im.height*sc)/2,im.width*sc,im.height*sc)}}
      const rem=remarkOf(v,cat);wrapText(g,rem,xs[3]+14,y+4,cw[3]-28,rowH-8,22,rem==='OK'?'#111':'#9A2F18');
    }
    y+=rowH;
  }
  add(cv);
  const [yy,mm]=v.date.split('-');
  return{blob:doc.output('blob'),name:`${(+yy)-1911}${mm}巡檢紀錄_${C.name}_${v.clientKey}.pdf`};
}
async function makeAllPdf(v){
  if(!window.jspdf){toast('PDF 元件沒有載入，請關掉 App 重新開啟');return}
  const files=[];
  try{
    for(const [i,cat] of v.cats.entries()){busy(`正在產生 ${CATS[cat].name} PDF（${i+1}/${v.cats.length}）…`);files.push(Object.assign({cat},await buildPdf(v,cat)))}
  }catch(err){console.error(err);busy();toast('PDF 產生失敗：'+(err&&err.message||'未知錯誤'));return}
  busy();
  const warn=[];for(const c of v.cats){const s=catStats(v,c);if(!sigOf(v,c))warn.push(`${CATS[c].name}還沒有客戶簽名`);if(s.missing)warn.push(`${CATS[c].name}有 ${s.missing} 張照片待補`)}
  const fileObjs=files.map(f=>new File([f.blob],f.name,{type:'application/pdf'}));
  const canShare=navigator.canShare&&navigator.canShare({files:fileObjs});
  const urls=files.map(f=>URL.createObjectURL(f.blob));
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h3>PDF 已產生</h3>
    ${files.map((f,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><span style="flex:1;word-break:break-all">${esc(f.name)}<br><span class="note">約 ${(f.blob.size/1048576).toFixed(1)} MB</span></span><a class="btn small" href="${urls[i]}" target="_blank" rel="noopener" download="${esc(f.name)}">開啟</a></div>`).join('')}
    ${warn.length?`<p class="note" style="color:var(--warn)">${warn.map(esc).join('<br>')}</p>`:''}
    <div style="display:grid;gap:10px;margin-top:14px">
      ${canShare?`<button class="btn primary big" id="share">${files.length>1?'全部':''}寄出或儲存（分享）</button>`:''}
      <button class="btn danger" id="done">PDF 都存好或寄出了，清除這次巡檢</button>
      <button class="btn" id="close">先不要清除，關閉</button>
    </div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();setTimeout(()=>urls.forEach(u=>URL.revokeObjectURL(u)),60000)};
  $('#close',ov).onclick=close;
  const sh=$('#share',ov);if(sh)sh.onclick=async()=>{try{await navigator.share({files:fileObjs})}catch(e){if(e.name!=='AbortError')toast('無法分享，請改用「開啟」')}};
  $('#done',ov).onclick=async()=>{if(!await ask('確定 PDF 都已經存好或寄出了嗎？<br>清除後，這次巡檢的照片和簽名都會刪除，無法復原。','確定清除','還沒'))return;close();await deleteVisit(v);toast('已清除這次巡檢');go('#/')};
}

/* ================= 設定 ================= */
async function pageSettings(){
  let usage='';try{const e=await navigator.storage.estimate();usage=`目前使用約 ${(e.usage/1048576).toFixed(0)} MB`}catch(e){}
  app.innerHTML=`<div class="bar"><button class="link" onclick="location.hash='#/'">‹ 首頁</button></div>
    <div class="bar"><h1>設定</h1></div>
    <div class="panel" style="display:grid;gap:16px">
      <div><label class="f" for="sWho">預設巡檢人員</label><input type="text" id="sWho" value="${esc(settings.inspector)}" placeholder="你的姓名"></div>
      <label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" id="sStamp" ${settings.stamp?'checked':''} style="width:22px;height:22px"> 在照片右下角加上日期（你的相機已經有日期的話不用開）</label>
      ${usage?`<div class="note">${usage}</div>`:''}
    </div>`;
  $('#sWho').oninput=debounce(e=>{settings.inspector=e.target.value.trim();saveSettings()},300);
  $('#sStamp').onchange=e=>{settings.stamp=e.target.checked;saveSettings()};
}

/* ================= 啟動 ================= */
async function boot(){
  try{await DB.open()}catch(e){app.innerHTML='<p style="padding:40px 0">這個瀏覽器無法儲存資料，請用 Safari 開啟，並關閉「無痕瀏覽」。</p>';return}
  visits=await DB.all('visits');
  const st=await DB.get('meta','settings');if(st)settings=Object.assign(settings,st);
  config=await DB.get('meta','config')||null;
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  route();
}
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
